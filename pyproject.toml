[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Long lines are tolerated in error messages and SQL strings (the project has no auto-formatter).
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency/query declarations are meant to be function calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]