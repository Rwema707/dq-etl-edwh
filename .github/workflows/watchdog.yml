name: Pipeline watchdog

# Independent of the daily ETL: fails (and alerts Slack) if no pipeline run has been recorded recently,
# which is the one failure the ETL itself cannot report (a schedule that never fired).
on:
  schedule:
    - cron: "30 9 * * *"     # 3.5h after the 06:00 UTC ETL
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m etl.watchdog --max-age-hours 26
