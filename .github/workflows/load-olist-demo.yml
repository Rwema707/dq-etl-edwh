name: Load Olist demo data

# Manual. Downloads the public Olist dataset, splits it into daily batches and replays a date range through the
# pipeline into the database in the DATABASE_URL secret. It can share that database with the simulated daily run:
# runs are tagged by dataset and the dashboard has a Dataset picker (see docs/real-data.md).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First batch date (Olist covers 2016-09 to 2018-10)"
        required: true
        default: "2018-03-01"
      end:
        description: "Last batch date"
        required: true
        default: "2018-04-15"

concurrency:
  group: load-olist-demo
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IN_START: ${{ inputs.start }}
      IN_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - run: pip install -r requirements-etl.txt

      - name: Check configuration and inputs
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL is not set"; exit 1; fi
          for v in "$IN_START" "$IN_END"; do
            echo "$v" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::dates must look like 2018-03-01"; exit 1; }
          done

      - name: Download Olist files (row counts are verified)
        run: python -m sources.fetch_olist --raw-dir data/raw/olist

      - name: Split into daily batches
        run: python -m sources.olist --raw data/raw/olist --out data/incoming --start "$IN_START" --end "$IN_END"

      - name: Replay through the pipeline
        run: python -m etl.backfill --contract contracts/olist_orders.yaml --data-dir data/incoming --start "$IN_START" --end "$IN_END"
